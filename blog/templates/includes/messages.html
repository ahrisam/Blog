{% if messages %}
<div class="messages-container flex flex-col gap-3 mb-4">
    {% for message in messages %}
        <div class="js-alert flex items-start justify-between gap-3 border rounded-xl px-4 py-3 shadow-sm
            {% if message.tags == 'success' %}bg-green-50 border-green-200 text-green-800
            {% elif message.tags == 'error' or message.tags == 'danger' %}bg-red-50 border-red-200 text-red-800
            {% elif message.tags == 'warning' %}bg-amber-50 border-amber-200 text-amber-800
            {% else %}bg-blue-50 border-blue-200 text-blue-800{% endif %}"
            role="alert">
            <div class="flex items-start gap-2">
                <span class="mt-0.5">&#9679;</span>
                <span class="text-sm font-medium">{{ message }}</span>
            </div>
            <button type="button" class="js-alert-dismiss text-lg leading-none opacity-60 hover:opacity-100 transition-opacity" aria-label="Dismiss">&times;</button>
        </div>
    {% endfor %}
</div>
{% endif %}
