{% extends "base.html" %}
{% load static %}

{% block title %}Delete Post{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-lg p-8 text-center">
        <div class="w-14 h-14 rounded-full bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-5">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h1 class="text-xl font-serif font-semibold text-slate-900 mb-2">Delete this post?</h1>
        <p class="text-slate-500 text-sm mb-6">
            You're about to permanently delete <span class="font-medium text-slate-700">&ldquo;{{ post.title }}&rdquo;</span>.
            This action cannot be undone.
        </p>

        <form method="post" id="delete-post-form">
            {% csrf_token %}
            <div class="flex items-center justify-center gap-3">
                <a href="{% url 'blog:post_detail' post.slug %}" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-danger js-confirm-delete">Yes, Delete Post</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
